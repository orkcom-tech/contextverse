# Emergency / one-off GoReleaser for an existing tag.
# Normal releases go through ci.yml (main minor) or bump-major / release-branch.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release (e.g. v0.2.0). Must already exist on the default branch history."
        required: true
        type: string

permissions:
  contents: write
  # Keyless signing: cosign exchanges this for a short-lived Fulcio certificate
  # bound to this workflow's identity, so there is no private key to lose and a
  # verifier can ask "was this built by this repository's release workflow"
  # rather than "do I recognise this key". ci.yml has always had it; these
  # three did not, which is half of why they could not sign.
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          # The runner ships a cached Go and setup-go uses it unless told
          # otherwise, so a minor pin alone does NOT mean "the newest patch":
          # this job resolved 1.26.x to the cached 1.26.5 while the advisories
          # it then reported were all fixed in 1.26.6. check-latest asks for
          # the newest matching release instead of whatever the image has.
          check-latest: true

      # Signing and the bill of materials, the same two tools ci.yml puts on
      # the runner. Missing here until the first time this workflow was
      # actually used: GoReleaser built every binary, every archive and every
      # package for v1.0.0 and then failed on `exec: "syft": executable file
      # not found in $PATH`, three minutes in, with the tag already pushed.
      #
      # A release path that is only exercised on the day it is needed is a
      # release path nobody has run. All three of the manual ones had the same
      # hole.
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}

      # And the packages, which this workflow did not do.
      #
      # It is the one reached when something has gone wrong with an automatic
      # release, so stopping at the GitHub release left exactly the half-done
      # state it exists to repair: binaries published, and `brew install` still
      # handing people the previous version. v1.0.0 landed that way — the
      # GitHub release complete, the tap still on 0.31.0.
      #
      # Skipped rather than failed without the token, because re-running this
      # to fix a GitHub release is legitimate on a fork or a repository whose
      # packaging secret is not configured, and a red run there would say
      # something untrue about the release itself.
      #
      # The check is inside the step, not in `if:`. The secrets context is not
      # available to a step-level condition — it silently evaluates to nothing,
      # and the step would be skipped on every run including the ones that have
      # the token.
      - name: Publish Homebrew + Scoop
        env:
          PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -z "${PACKAGING_TOKEN}" ]]; then
            echo "PACKAGING_TOKEN is not configured — the GitHub release is published, the tap and the bucket are not." >&2
            exit 0
          fi
          bash scripts/ci/publish-packages.sh "$TAG"
