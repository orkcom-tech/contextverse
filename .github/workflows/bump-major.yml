name: bump-major

on:
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  # Keyless signing: cosign exchanges this for a short-lived Fulcio certificate
  # bound to this workflow's identity, so there is no private key to lose and a
  # verifier can ask "was this built by this repository's release workflow"
  # rather than "do I recognise this key". ci.yml has always had it; these
  # three did not, which is half of why they could not sign.
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Bump major must be run from main (got ${GITHUB_REF})" >&2
            exit 1
          fi

  test:
    needs: [guard]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          # The runner ships a cached Go and setup-go uses it unless told
          # otherwise, so a minor pin alone does NOT mean "the newest patch":
          # this job resolved 1.26.x to the cached 1.26.5 while the advisories
          # it then reported were all fixed in 1.26.6. check-latest asks for
          # the newest matching release instead of whatever the image has.
          check-latest: true
      - name: Test
        run: go test ./...
      - name: Build
        shell: bash
        run: |
          out=contextd
          [[ "${RUNNER_OS}" == "Windows" ]] && out=contextd.exe
          go build -o "$out" ./cmd/contextd

  integration:
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          # The runner ships a cached Go and setup-go uses it unless told
          # otherwise, so a minor pin alone does NOT mean "the newest patch":
          # this job resolved 1.26.x to the cached 1.26.5 while the advisories
          # it then reported were all fixed in 1.26.6. check-latest asks for
          # the newest matching release instead of whatever the image has.
          check-latest: true
      - name: Integration (MinIO + Postgres)
        run: make test-integration

  release:
    name: release (major)
    needs: [test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          # The runner ships a cached Go and setup-go uses it unless told
          # otherwise, so a minor pin alone does NOT mean "the newest patch":
          # this job resolved 1.26.x to the cached 1.26.5 while the advisories
          # it then reported were all fixed in 1.26.6. check-latest asks for
          # the newest matching release instead of whatever the image has.
          check-latest: true

      # Signing and the bill of materials, the same two tools ci.yml puts on
      # the runner. Missing here until the first time this workflow was
      # actually used: GoReleaser built every binary, every archive and every
      # package for v1.0.0 and then failed on `exec: "syft": executable file
      # not found in $PATH`, three minutes in, with the tag already pushed.
      #
      # A release path that is only exercised on the day it is needed is a
      # release path nobody has run. All three of the manual ones had the same
      # hole.
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - name: Compute next major version
        id: ver
        run: |
          set -euo pipefail
          eval "$(bash scripts/ci/next-version.sh major | sed 's/^/export /')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "Next release: ${TAG}"

      - name: Create tag and release branch
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: bash scripts/ci/create-release-refs.sh "$TAG"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.ver.outputs.tag }}

      - name: Publish Homebrew + Scoop
        env:
          PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: bash scripts/ci/publish-packages.sh "$TAG"
