name: ci

# Product CI. Docs / Helm / README-only pushes do NOT trigger this workflow
# (see docs.yml). Auto minor release only when product code changed on main.
# Manual Run workflow: skip the change gate → tests → build → minor release.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"
      - ".goreleaser.yaml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/bump-major.yml"
      - ".github/workflows/release-branch.yml"
      - ".github/workflows/release.yml"
  push:
    branches:
      - main
      - "test/**"
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "cmd/**"
      - "internal/**"
      - "scripts/**"
      - ".goreleaser.yaml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/bump-major.yml"
      - ".github/workflows/release-branch.yml"
      - ".github/workflows/release.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  pull-requests: read
  # Keyless signing: cosign exchanges this for a short-lived Fulcio certificate
  # bound to the workflow identity, so there is no private key for anyone to
  # lose and a verifier can ask "was this built by this repository's release
  # workflow" rather than "do I recognise this key".
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.resolve.outputs.product }}
      tests: ${{ steps.resolve.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            product:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'cmd/**'
              - 'internal/**'
              - 'scripts/**'
              - '.goreleaser.yaml'
            tests:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'cmd/**'
              - 'internal/**'
              - 'scripts/**'
              - '.goreleaser.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/bump-major.yml'
              - '.github/workflows/release-branch.yml'
              - '.github/workflows/release.yml'
      - name: Resolve product gate
        id: resolve
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "product=true" >> "$GITHUB_OUTPUT"
            echo "tests=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — skip change filter, full pipeline"
          else
            echo "product=${{ steps.filter.outputs.product }}" >> "$GITHUB_OUTPUT"
            echo "tests=${{ steps.filter.outputs.tests }}" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: [changes]
    if: needs.changes.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          # The runner ships a cached Go and setup-go uses it unless told
          # otherwise, so a minor pin alone does NOT mean "the newest patch":
          # this job resolved 1.26.x to the cached 1.26.5 while the advisories
          # it then reported were all fixed in 1.26.6. check-latest asks for
          # the newest matching release instead of whatever the image has.
          check-latest: true
      - name: Download modules (retry)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt $i), retrying..."
            sleep $((i * 5))
          done
          echo "go mod download failed after retries" >&2
          exit 1
      # -race on every platform, because the bugs it finds do not reproduce
      # reliably and the suite had never been run under it. The first run found
      # a real data race; a suite that only ever runs without it is a suite that
      # cannot see the class of bug most likely to reach production.
      - name: Test
        run: go test -race ./...
      - name: Build
        shell: bash
        run: |
          out=contextd
          [[ "${RUNNER_OS}" == "Windows" ]] && out=contextd.exe
          go build -o "$out" ./cmd/contextd
      # Cheap and catches a category tests do not: printf verbs that do not
      # match their arguments, unreachable code, lost struct tags.
      - name: Vet
        run: go vet ./...
      - name: Vet integration-tagged code
        if: runner.os == 'Linux'
        run: go vet -tags integration ./...
      - name: Shellcheck install.sh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/install.sh
      - name: next-version self-test
        if: runner.os == 'Linux'
        run: bash scripts/ci/next-version_test.sh

  analysis:
    needs: [changes]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          # The runner ships a cached Go and setup-go uses it unless told
          # otherwise, so a minor pin alone does NOT mean "the newest patch":
          # this job resolved 1.26.x to the cached 1.26.5 while the advisories
          # it then reported were all fixed in 1.26.6. check-latest asks for
          # the newest matching release instead of whatever the image has.
          check-latest: true
      # Known vulnerabilities in what we actually call, not merely in what we
      # depend on: govulncheck reports a module only when a reachable path
      # exists, so it stays quiet enough to be worth reading.
      #
      # It also reports the STANDARD LIBRARY, which is what pinning the
      # toolchain costs: govulncheck@latest is installed on every run, so the
      # day an advisory lands with a fix in a newer Go, an older toolchain turns
      # this job red with no change to the code. That is the scanner working —
      # the fix is to move the toolchain, not to stop asking.
      #
      # Which takes BOTH halves, and the first attempt only had one: a minor
      # pin (1.26.x) does not mean "the newest patch", because setup-go uses
      # the Go cached in the runner image unless check-latest asks it not to.
      # It resolved to 1.26.5 and reported fourteen advisories every one of
      # which was fixed in 1.26.6, released that morning.
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      # v2, not v1.62: that binary is built with Go 1.23 and refuses to load a
      # module targeting 1.25 — "the Go language version used to build
      # golangci-lint is lower than the targeted Go version". It failed on its
      # first CI run for that reason and nothing to do with the code.
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12
          args: --timeout=5m

  integration:
    needs: [changes]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          # The runner ships a cached Go and setup-go uses it unless told
          # otherwise, so a minor pin alone does NOT mean "the newest patch":
          # this job resolved 1.26.x to the cached 1.26.5 while the advisories
          # it then reported were all fixed in 1.26.6. check-latest asks for
          # the newest matching release instead of whatever the image has.
          check-latest: true
      - name: Download modules (retry)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt $i), retrying..."
            sleep $((i * 5))
          done
          echo "go mod download failed after retries" >&2
          exit 1
      - name: Integration (MinIO + Postgres)
        run: make test-integration

  release:
    name: release (minor)
    if: |
      always() &&
      needs.changes.outputs.product == 'true' &&
      needs.test.result == 'success' &&
      needs.analysis.result == 'success' &&
      needs.integration.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        github.event_name == 'workflow_dispatch'
      )
    needs: [changes, test, analysis, integration]
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          # The runner ships a cached Go and setup-go uses it unless told
          # otherwise, so a minor pin alone does NOT mean "the newest patch":
          # this job resolved 1.26.x to the cached 1.26.5 while the advisories
          # it then reported were all fixed in 1.26.6. check-latest asks for
          # the newest matching release instead of whatever the image has.
          check-latest: true

      # Signing and the bill of materials. Both are GoReleaser steps; these put
      # the tools on the runner.
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - name: Compute next minor version
        id: ver
        run: |
          set -euo pipefail
          eval "$(bash scripts/ci/next-version.sh minor | sed 's/^/export /')"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "Next release: ${TAG}"

      - name: Create tag and release branch
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: bash scripts/ci/create-release-refs.sh "$TAG"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.ver.outputs.tag }}

      - name: Publish Homebrew + Scoop
        env:
          PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: bash scripts/ci/publish-packages.sh "$TAG"
